<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SweetAlert2 Test - Vie Associative</title>
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- SweetAlert2 Helpers -->
    <script src="../assets/js/sweetalert-helpers.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #333;
            margin-bottom: 0.5rem;
            font-size: 2.5rem;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 3rem;
            font-size: 1.1rem;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }
        
        .section {
            background: #f8f9fa;
            padding: 2rem;
            border-radius: 12px;
            border: 2px solid #e9ecef;
        }
        
        .section h2 {
            color: #495057;
            margin-bottom: 1rem;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .icon {
            font-size: 1.5rem;
        }
        
        .btn {
            display: block;
            width: 100%;
            padding: 0.75rem 1.5rem;
            margin-bottom: 0.75rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .btn-error {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        
        .btn-warning {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            color: #333;
        }
        
        .btn-info {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        
        .btn-confirm {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
        }
        
        .btn-delete {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: #333;
        }
        
        .btn-loading {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            color: #333;
        }
        
        .btn-toast {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            color: #333;
        }
        
        .btn-input {
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
        }
        
        .btn-custom {
            background: linear-gradient(135deg, #f857a6 0%, #ff5858 100%);
        }
        
        .footer {
            text-align: center;
            color: #6c757d;
            padding-top: 2rem;
            border-top: 2px solid #e9ecef;
        }
        
        .footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        
        .footer a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 1.5rem;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎉 SweetAlert2 Test Page</h1>
        <p class="subtitle">Test des confirmations et alertes pour Vie Associative</p>
        
        <div class="grid">
            <!-- Messages Simples -->
            <div class="section">
                <h2><span class="icon">✅</span> Messages</h2>
                <button class="btn btn-success" onclick="testSuccess()">Success</button>
                <button class="btn btn-error" onclick="testError()">Error</button>
                <button class="btn btn-warning" onclick="testWarning()">Warning</button>
                <button class="btn btn-info" onclick="testInfo()">Info</button>
            </div>
            
            <!-- Confirmations -->
            <div class="section">
                <h2><span class="icon">❓</span> Confirmations</h2>
                <button class="btn btn-confirm" onclick="testConfirm()">Confirmation Simple</button>
                <button class="btn btn-delete" onclick="testConfirmDelete()">Confirmation Suppression</button>
            </div>
        </div>
        
        <div class="footer">
            <p><strong>Projet Vie Associative EILCO</strong></p>
            <p>SweetAlert2 v11 | <a href="https://sweetalert2.github.io/" target="_blank">Documentation</a></p>
        </div>
    </div>
    
    <script>
        // Messages Simples
        function testSuccess() {
            SwalHelper.success('Opération réussie !', 'Le club a été créé avec succès');
        }
        
        function testError() {
            SwalHelper.error('Erreur', 'Une erreur est survenue lors de l\'opération');
        }
        
        function testWarning() {
            SwalHelper.warning('Attention !', 'Cette action est irréversible');
        }
        
        function testInfo() {
            SwalHelper.info('Information', 'Votre session expire dans 5 minutes');
        }
        
        // Confirmations
        function testConfirm() {
            SwalHelper.confirm(
                'Êtes-vous sûr ?',
                'Voulez-vous vraiment continuer ?'
            ).then((result) => {
                if (result.isConfirmed) {
                    SwalHelper.success('Confirmé !', 'Action effectuée');
                }
            });
        }
        
        function testConfirmDelete() {
            SwalHelper.confirmDelete('le club "Robotique"')
                .then((result) => {
                    if (result.isConfirmed) {
                        SwalHelper.success('Supprimé !', 'Le club a été supprimé');
                    }
                });
        }
    </script>
</body>
</html>
